[package]
name = "wams"
version = "0.4.2"
edition = "2024"

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "accesskit", "x11", "wayland"] }
rayon = "1.12.0"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_Performance", "Win32_System_Services", "Win32_System_SystemInformation", "Win32_System_Threading"] }
winreg = "0.56.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2.189"

[target."cfg(not(windows))".dependencies]
sysinfo = { version = "0.40.3", default-features = false, features = ["system"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
